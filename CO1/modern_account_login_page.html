<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.25);
      --bg-gradient: radial-gradient(circle at 15% 15%, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --focus-ring: 0 0 0 4px rgba(99, 102, 241, 0.15);
      --card-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
      --radius-lg: 16px;
      --radius-md: 10px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark theme adaptation */
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --primary-glow: rgba(99, 102, 241, 0.35);
        --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 75%);
        --card-bg: rgba(30, 41, 59, 0.85);
        --border-color: rgba(255, 255, 255, 0.1);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --focus-ring: 0 0 0 4px rgba(129, 140, 248, 0.25);
        --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 1.5rem;
      line-height: 1.5;
    }

    .login-container {
      width: 100%;
      max-w: 420px;
      margin: auto;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, #818cf8 100%);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-bottom: 0.75rem;
      box-shadow: 0 10px 15px -3px var(--primary-glow);
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .brand-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    form {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      padding: 2.25rem 2rem;
      position: relative;
    }

    fieldset {
      border: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    legend {
      float: left;
      width: 100%;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      letter-spacing: -0.015em;
    }

    fieldset > div {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      position: relative;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      display: inline-block;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      background-color: transparent;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: var(--transition);
      outline: none;
    }

    input[type="password"] {
      padding-right: 2.75rem;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: var(--focus-ring);
    }

    input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* Toggle password visibility button */
    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      border-radius: 6px;
      transition: var(--transition);
    }

    .toggle-password:hover {
      color: var(--text-main);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    button[type="submit"]:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px var(--primary-glow);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    button[type="submit"]:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring), 0 4px 12px var(--primary-glow);
    }

    /* Spinner style when loading */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Auxiliary utility links */
    .form-extras {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -0.25rem;
      font-size: 0.8125rem;
    }

    .helper-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
    }

    .helper-link:hover {
      text-decoration: underline;
    }

    .footer-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Status alert box */
    .status-alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .status-alert.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>
  <main class="login-container">
    <div class="brand-header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <h1>Welcome back</h1>
      <p>Please enter your details to access your account</p>
    </div>

    <!-- Alert status message box -->
    <div id="statusMessage" class="status-alert" role="status" aria-live="polite"></div>

    <!-- Exact requested form structure -->
    <form action="/login" method="POST" id="loginForm">
      <fieldset>
        <legend>Account Login</legend>
        
        <div>
          <label for="loginUsername">Username:</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="loginUsername" 
              name="username" 
              required 
              autocomplete="username"
              placeholder="e.g. alex.morgan">
          </div>
        </div>
        
        <div>
          <label for="loginPassword">Password:</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="loginPassword" 
              name="password" 
              required 
              autocomplete="current-password"
              placeholder="••••••••">
            <!-- Password visibility toggle button -->
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="form-extras">
            <span></span>
            <a href="#forgot" class="helper-link">Forgot password?</a>
          </div>
        </div>
        
        <div>
          <!-- Changed type from "button" to "submit" -->
          <button type="submit" id="submitBtn">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">Login</span>
          </button>
        </div>
      </fieldset>
    </form>

    <p class="footer-note">
      Don't have an account? <a href="#signup" class="helper-link">Sign up</a>
    </p>
  </main>

  <script>
    // Password toggle visibility functionality
    const passwordInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      
      // Toggle eye / eye-off SVG icon
      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // Form submission feedback simulation
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const statusMessage = document.getElementById('statusMessage');

    loginForm.addEventListener('submit', (e) => {
      // Prevent immediate reload for demo visualization
      e.preventDefault();

      // Enter loading state
      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Authenticating...';

      // Simulate a quick network request
      setTimeout(() => {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Login';

        // Display success confirmation
        statusMessage.textContent = 'Logged in successfully! Redirecting...';
        statusMessage.className = 'status-alert success';

        // If connected to a real server, submit form programmatically:
        // loginForm.submit();
      }, 1200);
    });
  </script>
</body>
</html>
